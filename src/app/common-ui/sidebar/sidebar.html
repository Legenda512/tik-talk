@let myProfileValue = myProfile();

<img src="assets/svg/logo-small.svg" alt="" class="ml16 mb20" />

<nav class="mb20">
  <ul class="main-menu-list">
    @for (menuItem of menuItems; track menuItem.label) {
      <li>
        <a class="menu-item" [routerLink] ="[menuItem.link]">
          <svg [icon]="menuItem.icon"></svg>
          <span>{{ menuItem.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>

<p class="medium-text mb20">Подписчики</p>

@for (subscriber of subscribers$ | async; track subscriber.id) {
  <app-subscriber-card [profile]="subscriber"></app-subscriber-card>
}

<div class="mt20 to-subscribers">
  <a [routerLink]="['/subscribers']" class="to-subscribers-link medium-text">Все подписчики</a>
  <svg icon="arrow" class="to-subscribers-icon"></svg>
</div>

<footer class="sidebar__footer">
  @if (myProfileValue) {
    <img
      [ngSrc]="myProfileValue.avatarUrl ?? 'assets/imgs/avatar-placeholder.png'"
      [alt]="myProfileValue.lastName"
      class="my-profile-icon"
      width="32"
      height="32"
    />

    <div class="medium-text username-text">{{ myProfileValue.username }}</div>

    <a [routerLink]="['settings']" class="settings-btn">
      <svg icon="settings"></svg>
    </a>
  }
</footer>
