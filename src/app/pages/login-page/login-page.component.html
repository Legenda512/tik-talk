<form
  action=""
  class="login-form"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  xmlns="http://www.w3.org/1999/html"
>
  <h1 class="h1 mb60">Вход</h1>

  <label class="tt-control-label mb16">
    Telegram username
    <input formControlName="username" class="tt-input" type="text" placeholder="Введите логин" />
  </label>

  <label class="tt-control-label mb32">
    Пароль

    <div class="password-input">
      <input
        formControlName="password"
        class="tt-input"
        [type]="isPasswordVisible() ? 'text' : 'password'"
        placeholder="Введите пароль"
      />

      <button
        class="password-eye-btn"
        [class.active]="isPasswordVisible()"
        (click)="isPasswordVisible.set(!isPasswordVisible())"
      >
        <svg icon="eye"></svg>
      </button>
    </div>
  </label>

  <button class="btn btn-shadow" type="submit">Войти</button>
</form>

<img ngSrc="/assets/svg/logo-big.svg" alt="logo" height="432" width="440" priority="true" />
