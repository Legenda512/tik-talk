<a [routerLink]="['profile/me']">
  <img
    ngSrc="/assets/svg/logo-small.svg"
    alt=""
    class="ml16 mb20"
    width="61"
    height="74"
    [priority]="true"
  />
</a>

<nav class="mb20">
  <ul class="main-menu-list">
    @for (menuItem of menuItems; track menuItem.label) {
      <li>
        <a class="menu-item" [routerLink]="[menuItem.route]" routerLinkActive="active">
          <lib-svg-icon [icon]="menuItem.icon"></lib-svg-icon>
          <span>{{ menuItem.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>

<p class="medium-text mb20">Подписчики</p>

@for (subscriber of subscribers(); track subscriber.id) {
  <lib-subscriber-card [profile]="subscriber"></lib-subscriber-card>
} @empty {
  Нет подписчиков
}

<div class="mt20 to-subscribers">
  <a [routerLink]="['/subscribers']" class="to-subscribers-link medium-text">Все подписчики</a>
  <lib-svg-icon icon="arrow" class="to-subscribers-icon"></lib-svg-icon>
</div>

<footer class="sidebar__footer">
  @if (myProfile(); as myProfile) {
    <div class="my-profile-icon-frame">
      <img
        [ngSrc]="myProfile.avatarUrl ?? '/assets/imgs/avatar-placeholder.png'"
        [alt]="myProfile.lastName"
        class="my-profile-icon"
        [fill]="true"
      />
    </div>

    <div class="medium-text username-text">{{ myProfile.username }}</div>

    <a [routerLink]="['settings']" class="settings-btn">
      <lib-svg-icon icon="settings"></lib-svg-icon>
    </a>
  }
</footer>
