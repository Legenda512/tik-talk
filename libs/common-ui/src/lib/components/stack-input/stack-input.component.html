<div class="stack-control">
  @for (tech of value(); track tech; let i = $index) {
    <div class="skill-tag stack-tag">
      <button type="button" class="stack-btn__delete svg16" (click)="onTagDelete(i)">
        <app-svg-icon icon="cross" class="svg10"></app-svg-icon>
      </button>
      {{ tech }}
    </div>
  }

  <input
    [(ngModel)]="innerInput"
    (keydown.enter)="onEnter($event)"
    type="text"
    class="stack-ghost-input"
  />
</div>
