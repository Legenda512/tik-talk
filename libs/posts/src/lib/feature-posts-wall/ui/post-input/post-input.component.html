@if (profile(); as profile) {
  <lib-avatar-circle
    class="size32"
    [avatarUrl]="profile.avatarUrl"
    [avatarAlt]="profile.lastName"
  ></lib-avatar-circle>
}

<textarea
  [ngModel]="postText()"
  (ngModelChange)="postText.set($event)"
  (input)="onTextAreaInput($event)"
  class="hidden-textarea"
></textarea>

<button class="btn-icon" (click)="onCreatePost()">
  <lib-svg-icon icon="send-message" class="svg16"></lib-svg-icon>
</button>
