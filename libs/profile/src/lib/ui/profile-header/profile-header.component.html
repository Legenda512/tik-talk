@let profileValue = profile();

<lib-avatar-circle
  [avatarUrl]="profileValue.avatarUrl"
  [avatarAlt]="profileValue.lastName"
></lib-avatar-circle>

<div class="username-and-name">
  <h1 class="h4 mb4">{{ profileValue.firstName }} {{ profileValue.lastName }}</h1>
  <span class="regular">{{ profileValue.username }}</span>
</div>
